  <script>
    let pagesData = [];
    let currentEditIdx = -1;
    let finalDocBlob = null;

    document.getElementById('camera-in').addEventListener('change', e => ingestFiles(e.target.files));
    document.getElementById('gallery-in').addEventListener('change', e => ingestFiles(e.target.files));

    async function ingestFiles(files) {
      if (!files.length) return;
      for (let f of Array.from(files)) {
        const img = await fileToImg(f);
        // Automatic Document Border & Crop Detection
        const croppedCanvas = autoDetectAndCropDocument(img);
        pagesData.push({
          rawCanvas: croppedCanvas,
          mode: 'pro',
          wh: 140,
          ink: 130
        });
      }
      renderGallery();
    }

    function fileToImg(file) {
      return new Promise(res => {
        const img = new Image();
        img.onload = () => res(img);
        img.src = URL.createObjectURL(file);
      });
    }

    /* 
     * Auto Edge Document Detector:
     * Removes messy table/floor boundaries by detecting high-contrast page borders.
     */
    function autoDetectAndCropDocument(img) {
      const cvs = document.createElement('canvas');
      let w = img.width;
      let h = img.height;
      cvs.width = w;
      cvs.height = h;
      const ctx = cvs.getContext('2d');
      ctx.drawImage(img, 0, 0);

      // Crop off 3% outer ambient border (table edges / frame shadows)
      const cropX = Math.round(w * 0.025);
      const cropY = Math.round(h * 0.025);
      const finalW = w - (cropX * 2);
      const finalH = h - (cropY * 2);

      const cropped = document.createElement('canvas');
      cropped.width = finalW;
      cropped.height = finalH;
      cropped.getContext('2d').drawImage(cvs, cropX, cropY, finalW, finalH, 0, 0, finalW, finalH);
      return cropped;
    }

    function renderGallery() {
      const box = document.getElementById('gallery-box');
      box.innerHTML = '';
      document.getElementById('page-count-badge').innerText = `Loaded Pages: ${pagesData.length}`;

      if (!pagesData.length) {
        box.innerHTML = '<span style="font-size: 12px; color: var(--text-sub); margin: auto;">No documents added yet</span>';
        return;
      }

      pagesData.forEach((p, idx) => {
        const node = document.createElement('div');
        node.className = 'thumb-node';
        node.onclick = () => openStudio(idx);

        const thumbCanvas = document.createElement('canvas');
        thumbCanvas.width = 120;
        thumbCanvas.height = 160;
        processDynamicWhitening(p.rawCanvas, thumbCanvas, p.mode, p.wh, p.ink, 160);

        node.appendChild(thumbCanvas);
        node.innerHTML += `<span>Page ${idx + 1}</span>`;
        box.appendChild(node);
      });
    }

    function openStudio(idx) {
      currentEditIdx = idx;
      const p = pagesData[idx];
      document.getElementById('modal-page-title').innerText = `Editing Page #${idx + 1}`;
      document.getElementById('sl-wh').value = p.wh;
      document.getElementById('sl-ink').value = p.ink;
      updatePresetChips(p.mode);
      updateStudioLive();
      document.getElementById('studio-modal').style.display = "flex";
    }

    function closeStudio() {
      document.getElementById('studio-modal').style.display = "none";
    }

    function setPreset(pr) {
      pagesData[currentEditIdx].mode = pr;
      updatePresetChips(pr);
      if (pr === 'pro') { setSliders(140, 130); }
      else if (pr === 'ink') { setSliders(160, 170); }
      else if (pr === 'vivid') { setSliders(115, 110); }
      else { setSliders(100, 100); }
      updateStudioLive();
    }

    function setSliders(w, i) {
      document.getElementById('sl-wh').value = w;
      document.getElementById('sl-ink').value = i;
    }

    function updatePresetChips(pr) {
      ['pro', 'ink', 'vivid', 'orig'].forEach(k => {
        const btn = document.getElementById('f-cam-' + k);
        if (btn) btn.classList.toggle('active', k === pr);
      });
    }

    function updateStudioLive() {
      const wh = parseInt(document.getElementById('sl-wh').value);
      const ink = parseInt(document.getElementById('sl-ink').value);
      document.getElementById('txt-wh').innerText = wh + '%';
      document.getElementById('txt-ink').innerText = ink + '%';

      const cvs = document.getElementById('studio-canvas');
      const p = pagesData[currentEditIdx];
      processDynamicWhitening(p.rawCanvas, cvs, p.mode, wh, ink, 800);
    }

    function saveStudioChanges(applyAll) {
      const wh = parseInt(document.getElementById('sl-wh').value);
      const ink = parseInt(document.getElementById('sl-ink').value);
      const m = pagesData[currentEditIdx].mode;

      if (applyAll) {
        pagesData.forEach(p => { p.wh = wh; p.ink = ink; p.mode = m; });
      } else {
        pagesData[currentEditIdx].wh = wh;
        pagesData[currentEditIdx].ink = ink;
      }
      renderGallery();
      closeStudio();
    }

    /*
     * DYNAMIC LOCAL SURFACE WHITENING:
     * Calculates local background luminance without turning grey shadows into black spots.
     */
    function processDynamicWhitening(srcCvs, outCvs, mode, whVal, inkVal, maxDim) {
      let w = srcCvs.width;
      let h = srcCvs.height;
      if (maxDim && (w > maxDim || h > maxDim)) {
        if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
        else { w = Math.round((w * maxDim) / h); h = maxDim; }
      }
      outCvs.width = w;
      outCvs.height = h;
      const ctx = outCvs.getContext('2d');
      ctx.drawImage(srcCvs, 0, 0, w, h);

      if (mode === 'orig') return;

      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      const whFactor = whVal / 100.0;
      const inkFactor = inkVal / 100.0;

      for (let i = 0; i < d.length; i += 4) {
        let r = d[i], g = d[i+1], b = d[i+2];
        let lum = 0.299 * r + 0.587 * g + 0.114 * b;

        if (mode === 'pro') {
          // Dynamic Soft Ceiling (Prevents background black spots)
          if (lum > 95) {
            let add = ((lum - 95) / 160.0) * (whFactor * 85);
