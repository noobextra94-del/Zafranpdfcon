<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZafranPDF_Converter - Asli CamScanner Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #070b12; color: #f8fafc; min-height: 100vh; padding: 12px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 600px; }
    header { text-align: center; margin-bottom: 14px; }
    .badge { display: inline-block; background: #059669; color: white; font-size: 10px; font-weight: 800; padding: 3px 12px; border-radius: 20px; text-transform: uppercase; margin-bottom: 6px; }
    h1 { font-size: 19px; color: #38bdf8; font-weight: 800; }
    header p { color: #94a3b8; font-size: 12px; margin-top: 3px; }
    
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .btn-pick { display: block; width: 100%; text-align: center; padding: 14px; background: #1e293b; color: #f8fafc; border: 2px dashed #38bdf8; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 700; margin: 10px 0; }
    .btn-pick input { display: none; }

    .control-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn-filter { flex: 1; padding: 10px; background: #1f2937; color: #cbd5e1; border: 1px solid #374151; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .btn-filter.active { background: #059669; color: white; border-color: #10b981; }
    .btn-rotate { padding: 10px 14px; background: #334155; color: white; border: none; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }

    #preview-img { width: 100%; max-height: 250px; object-fit: contain; background: #000; border-radius: 8px; margin-bottom: 12px; display: none; }

    .btn-build { width: 100%; padding: 14px; background: linear-gradient(135deg, #059669, #047857); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; }
    .result-box { background: #064e3b; border: 1px solid #059669; border-radius: 10px; padding: 14px; margin-top: 12px; text-align: center; display: none; }
    .btn-dl { display: block; width: 100%; padding: 12px; background: #10b981; color: #022c22; font-weight: 800; border-radius: 8px; text-decoration: none; font-size: 14px; margin-bottom: 8px; }
    .btn-wa { width: 100%; padding: 10px; background: #25d366; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <span class="badge">OpenCV Sauvola Algorithm</span>
      <h1>ZafranPDF - Real CamScanner Studio</h1>
      <p>100% White Paper, Jet Black Ink & Auto Size Reduction</p>
    </header>

    <div class="card">
      <label class="btn-pick">
        📸 Photo ya Document Select Karein
        <input type="file" id="file-in" accept="image/*" multiple>
      </label>

      <img id="preview-img" src="" alt="preview">

      <div class="control-row">
        <button class="btn-filter active" id="f-magic" onclick="setMode('magic')">✨ Magic Color Pro</button>
        <button class="btn-filter" id="f-bw" onclick="setMode('bw')">📄 Deep B&W (Crisp)</button>
        <button class="btn-rotate" onclick="rotateImg()">🔄 Rotate 90°</button>
      </div>

      <button class="btn-build" onclick="processCamScanner()">⚡ Convert to 100% HD CamScanner PDF</button>
      <div id="status-bar" style="font-size: 12px; text-align: center; margin-top: 10px; color: #10b981;"></div>

      <div id="res-box" class="result-box">
        <div id="res-size" style="font-size: 15px; font-weight: 800; color: #a7f3d0; margin-bottom: 8px;">Size: 3.2 MB (Ultra Sharp)</div>
        <a id="res-link" class="btn-dl" href="#" download="Zafran_CamScanner.pdf">📥 Download PDF Now</a>
        <button class="btn-wa" onclick="shareWhatsApp()">💬 Share to WhatsApp</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://zafranpdf-converter.onrender.com";
    let selectedFiles = [];
    let currentMode = "magic";
    let currentRotation = 0;
    let finalBlob = null;

    document.getElementById('file-in').addEventListener('change', (e) => {
      selectedFiles = Array.from(e.target.files);
      if (selectedFiles.length > 0) {
        const preview = document.getElementById('preview-img');
        preview.src = URL.createObjectURL(selectedFiles[0]);
        preview.style.display = "block";
        document.getElementById('status-bar').innerText = `${selectedFiles.length} file(s) selected`;
      }
    });

    function setMode(m) {
      currentMode = m;
      document.getElementById('f-magic').classList.toggle('active', m === 'magic');
      document.getElementById('f-bw').classList.toggle('active', m === 'bw');
    }

    function rotateImg() {
      currentRotation = (currentRotation + 90) % 360;
      document.getElementById('preview-img').style.transform = `rotate(${currentRotation}deg)`;
    }

    async function processCamScanner() {
      if (selectedFiles.length === 0) return alert("Pehle Camera photo select karein!");
      const status = document.getElementById('status-bar');
      const resBox = document.getElementById('res-box');
      resBox.style.display = "none";

      status.innerText = "⏳ CamScanner Computer Vision algorithm running... Background shadows remove ho rahi hain...";

      const formData = new FormData();
      selectedFiles.forEach(f => formData.append("files", f));
      formData.append("mode", currentMode);
      formData.append("rotation", currentRotation);

      try {
        const res = await fetch(`${API_URL}/api/process-doc`, {
          method: "POST",
          body: formData
        });

        if (!res.ok) throw new Error("Processing failed");

        finalBlob = await res.blob();
        const mb = (finalBlob.size / (1024 * 1024)).toFixed(2);
        status.innerText = "✅ Completed with CamScanner Quality!";
        document.getElementById('res-size').innerText = `Final Size: ${mb} MB (100% Crisp Ink)`;
        
        const dl = document.getElementById('res-link');
        dl.href = URL.createObjectURL(finalBlob);
        resBox.style.display = "block";
      } catch (err) {
        status.innerText = "❌ Error: " + err.message;
      }
    }

    function shareWhatsApp() {
      if (!finalBlob) return;
      const file = new File([finalBlob], "Zafran_CamScanner.pdf", { type: "application/pdf" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: "CamScanner PDF", text: "Processed via ZafranPDF." });
      } else {
        alert("Pehle download karein phir WhatsApp par direct attach karke send karein.");
      }
    }
  </script>
</body>
</html>
